name: Architecture Diagrams

on:
  push:
    paths:
      - 'docs/architecture/**'
      - 'Scripts/render_architecture.py'
      - '.github/workflows/architecture.yml'
  pull_request:
    paths:
      - 'docs/architecture/**'
      - 'Scripts/render_architecture.py'
      - '.github/workflows/architecture.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli@11.4.2
      - name: Render diagrams and fail on any that does not render
        run: python3 Scripts/render_architecture.py --check
      - name: Publish rendered diagrams
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagrams
          path: docs/architecture/*.html
          if-no-files-found: error
